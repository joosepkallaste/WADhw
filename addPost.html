<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Post</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <header>
            <nav>
                <a href="index.html">Home</a>
                <a href="addPost.html">Add Post</a>
                <div class="profile-link">
                    <button id="profileButton" type="button">
                        <img src="profile.svg" alt="Profile">
                    </button>

                    <div id="profileMenu" class="dropdown">
                        <p>Joosep-Gre Kallaste</p>
                        <p>joosep-gre.kallaste@ut.ee</p>
                        <a href="login.html">Logout</a>
                    </div>
                </div>
            </nav>
        </header>

        <main>
            <section class="form-card">
                <form action="index.html">
                    <label>
                        Post body
                        <textarea name="postBody" placeholder="Write your post"></textarea>
                    </label>

                    <label>
                        Select file
                        <input type="file" name="postImage" accept="image/*">
                    </label>

                    <button type="submit">Create post</button>
                </form>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
